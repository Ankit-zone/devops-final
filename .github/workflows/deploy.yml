name: Deploy Churn ML App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "$HOME/churn-app" ]; then
              git clone https://github.com/${{ github.repository }}.git "$HOME/churn-app"
            fi
            cd "$HOME/churn-app"
            git fetch origin
            git reset --hard origin/main
            docker stop churn-container || true
            docker rm churn-container || true
            docker build -t churn-ml-app .
            docker run -d --restart unless-stopped -p 8501:8501 --name churn-container churn-ml-app
            docker ps